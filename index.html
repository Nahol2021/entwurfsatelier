<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurfsatelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ===================================================================
     GRAPHIT
     Keine Akzentfarbe. Was ausgewaehlt ist, ist voll schwarz (bzw. voll
     weiss) und unterstrichen; alles andere ist grau. In der Zeichnung
     traegt die Strichstaerke die Hierarchie, so wie in einer echten
     technischen Zeichnung: Umriss kraeftig, Details duenn, Hilfslinien
     gestrichelt.

     Der Arbeitsbereich laesst sich oben rechts zwischen hell und dunkel
     umschalten; ohne eigene Wahl folgt er dem System.
     =================================================================== */
  :root{
    --papier:#F2F2F0;      /* Bedienfeld */
    --tisch:#E6E6E3;       /* Flaeche hinter den Ansichten */
    --blatt:#FAFAF9;       /* Arbeitsbereich, auf dem gezeichnet wird */
    --tinte:#121417;
    --grau:#83868A;
    --leise:#A3A5A7;
    --linie:#DBDBD7;
    --linie2:#C4C4BF;
    --stoff:#FFFFFF;
    --gegen:#FAFAF9;       /* Schrift auf gefuelltem Grund */
    --schatten:rgba(0,0,0,.06);
    --ui:'IBM Plex Sans',system-ui,sans-serif;
    --zahl:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --papier:#1A1B1D; --tisch:#121315; --blatt:#202225;
      --tinte:#EDEDEB; --grau:#8A8D90; --leise:#6A6D70;
      --linie:#2E3033; --linie2:#3D4044;
      --stoff:#2A2D31; --gegen:#121417;
      --schatten:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --papier:#1A1B1D; --tisch:#121315; --blatt:#202225;
    --tinte:#EDEDEB; --grau:#8A8D90; --leise:#6A6D70;
    --linie:#2E3033; --linie2:#3D4044;
    --stoff:#2A2D31; --gegen:#121417;
    --schatten:rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--tisch); color:var(--tinte);
    font-family:var(--ui); font-size:15px; line-height:1.5;
  }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--tinte); outline-offset:2px; }

  /* ---------- Kopfzeile ---------- */
  header{
    display:flex; align-items:center; gap:.85rem; flex-wrap:wrap;
    padding:.8rem 1.15rem; background:var(--papier);
    border-bottom:1px solid var(--linie2);
  }
  header h1{
    font-size:1rem; font-weight:600; margin:0; letter-spacing:-.01em;
  }
  header .entwurfname{
    border:0; border-bottom:1px solid transparent; background:transparent;
    color:var(--grau); padding:.2rem .1rem; font-size:.88rem; min-width:10rem;
  }
  header .entwurfname:hover{ border-bottom-color:var(--linie2); }
  header .entwurfname:focus{ border-bottom-color:var(--tinte); color:var(--tinte); outline:none; }
  .rechts{ margin-left:auto; display:flex; gap:1.05rem; align-items:center; flex-wrap:wrap; }
  .rechts .trenner{ width:1px; height:1.05rem; background:var(--linie2); flex:none; }

  /* ---------- Knoepfe: Text mit Unterstrich, keine Kaesten ---------- */
  .knopf{
    background:none; border:0; border-bottom:2px solid transparent;
    color:var(--grau); padding:.14rem 0; cursor:pointer; font-size:.84rem;
  }
  .knopf:hover{ color:var(--tinte); border-bottom-color:var(--linie2); }
  .knopf.stark{ color:var(--tinte); font-weight:600; border-bottom-color:var(--tinte); }
  .knopf.stark:hover{ border-bottom-color:var(--tinte); }
  .knopf[disabled]{ color:var(--leise); cursor:not-allowed; border-bottom-color:transparent; }
  .knopf[disabled]:hover{ color:var(--leise); }

  /* ---------- Umschalter ---------- */
  .schalter{ display:inline-flex; gap:.8rem; }
  /* display schlaegt das hidden-Attribut - darum ausdruecklich zuruecknehmen */
  .schalter[hidden]{ display:none; }
  .schalter button{
    background:none; border:0; border-bottom:2px solid transparent;
    padding:.14rem 0; cursor:pointer; font-size:.82rem; color:var(--grau);
  }
  .schalter button:hover{ color:var(--tinte); border-bottom-color:var(--linie2); }
  .schalter button[aria-pressed="true"]{
    color:var(--tinte); font-weight:600; border-bottom-color:var(--tinte);
  }

  /* ---------- Grundgerüst ----------
     Die Arbeitsfläche bekommt allen Platz, der übrig bleibt. Gesteuert
     wird darunter, direkt an der Zeichnung - nicht in einer Spalte am
     anderen Bildschirmrand. */
  body{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header{ flex:none; }
  main{ flex:1; min-height:0; display:flex; flex-direction:column; }

  .buehne{
    flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr;
    gap:.9rem; padding:.9rem; background:var(--tisch);
  }
  .ansicht{
    background:var(--blatt); border:1px solid var(--linie); border-radius:2px;
    padding:.75rem; cursor:pointer; min-height:0;
    display:flex; flex-direction:column; gap:.45rem;
  }
  .ansicht[aria-current="true"]{ border-color:var(--tinte); }
  .ansicht .marke{
    flex:none; align-self:flex-start; font-size:.76rem; color:var(--grau);
    border-bottom:2px solid transparent; padding-bottom:.1rem;
  }
  .ansicht[aria-current="true"] .marke{
    color:var(--tinte); font-weight:600; border-bottom-color:var(--tinte);
  }
  svg.flat{ flex:1; min-height:0; width:100%; height:100%; touch-action:none; display:block; }

  /* ---------- Zeichnung: die Strichstärke trägt die Hierarchie ---------- */
  .flat .stoff{
    fill:var(--stoff); stroke:var(--tinte); stroke-width:1.6;
    stroke-linejoin:round; vector-effect:non-scaling-stroke;
  }
  .flat .stoff.nurlinie{ fill:none; }
  .flat .detail{
    fill:none; stroke:var(--tinte); stroke-width:0.9;
    stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke;
  }
  .flat .aufsatz{
    fill:var(--stoff); stroke:var(--tinte); stroke-width:1.2;
    stroke-linejoin:round; vector-effect:non-scaling-stroke;
  }
  .flat .mittellinie{
    stroke:var(--grau); stroke-width:0.8; stroke-dasharray:5 4;
    vector-effect:non-scaling-stroke;
  }
  .flat .griff{ fill:var(--tinte); stroke:none; cursor:grab; }
  .flat .griff.links{
    fill:var(--blatt); stroke:var(--tinte); stroke-width:1.6;
    vector-effect:non-scaling-stroke;
  }
  .flat .griff:active{ cursor:grabbing; }
  .flat .treffer{ fill:none; stroke:transparent; stroke-width:9; vector-effect:non-scaling-stroke; cursor:pointer; }
  .flat .kanteaktiv{ fill:none; stroke:var(--tinte); stroke-width:4; vector-effect:non-scaling-stroke; opacity:.3; }

  /* ---------- Steuerleiste ---------- */
  .leiste{
    flex:none; background:var(--papier); border-top:1px solid var(--linie2);
    max-height:46vh; overflow-y:auto;
  }
  .leiste .zeile{ display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; padding:.5rem .95rem; }
  .leiste .kopfzeile{ border-bottom:1px solid var(--linie); }
  .leiste .status{
    font-family:var(--zahl); font-size:.71rem; color:var(--grau);
    margin-left:auto; text-align:right;
  }
  .leiste .reiter{ gap:1.05rem; padding-bottom:.35rem; }
  .leiste .reiter:empty, .leiste .werkzeug:empty{ display:none; }
  .leiste .werkzeug{ align-items:flex-start; padding-top:.35rem; padding-bottom:.9rem; }

  .reiter button{
    background:none; border:0; border-bottom:2px solid transparent;
    padding:.16rem 0; cursor:pointer; font-size:.83rem; color:var(--grau);
  }
  .reiter button:hover{ color:var(--tinte); border-bottom-color:var(--linie2); }
  .reiter button[aria-pressed="true"]{ color:var(--tinte); font-weight:600; border-bottom-color:var(--tinte); }
  .reiter .marke{ font-family:var(--zahl); font-size:.66rem; color:var(--grau); margin-left:auto; }

  /* ---------- Auswahl ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:.15rem 1.05rem; }
  .chip{
    background:none; border:0; border-bottom:2px solid transparent;
    padding:.14rem 0; cursor:pointer; font-size:.85rem; color:var(--grau);
  }
  .chip:hover{ color:var(--tinte); border-bottom-color:var(--linie2); }
  .chip[aria-pressed="true"]{ color:var(--tinte); font-weight:600; border-bottom-color:var(--tinte); }
  .chip.zufuegen::before{ content:'+ '; color:var(--leise); }
  .chip.zufuegen:hover{ color:var(--tinte); }

  /* ---------- Regler ---------- */
  .regler{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:.1rem 1.4rem; width:100%;
  }
  .feld{ margin-bottom:.5rem; }
  .feld label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.78rem; color:var(--tinte); margin-bottom:.15rem; gap:.5rem;
  }
  .feld label .wert{ font-family:var(--zahl); font-size:.78rem; color:var(--tinte); }
  .feld.geteilt label::after{
    content:'beide'; font-family:var(--zahl); font-size:.6rem;
    color:var(--grau); order:1; margin-left:auto;
  }
  .feld.geteilt label .wert{ order:2; margin-left:.5rem; }
  .feld input[type=range]{ width:100%; accent-color:var(--tinte); height:1rem; }
  .feld input[type=number], .feld input[type=text]{
    width:100%; padding:.35rem .45rem; border:1px solid var(--linie2);
    background:var(--blatt); color:var(--tinte); border-radius:2px;
    font-family:var(--zahl); font-size:.84rem;
  }
  .feld input[type=file]{ font-size:.78rem; color:var(--grau); }

  .hinweis{ font-size:.79rem; color:var(--grau); margin:0; max-width:62ch; }
  .hinweis.warn{ border-left:3px solid var(--tinte); padding-left:.6rem; color:var(--tinte); }
  .spalte{ display:flex; flex-direction:column; gap:.45rem; align-items:flex-start; }

  /* ---------- Regal ---------- */
  .regal{
    flex:none; background:var(--papier); border-top:1px solid var(--linie2);
    padding:.75rem .95rem; max-height:34vh; overflow-y:auto;
  }
  .regal[hidden]{ display:none; }
  .regal .reihe{ display:flex; gap:.6rem; align-items:flex-start; overflow-x:auto; padding-bottom:.35rem; }
  .karte{
    flex:none; width:96px; background:var(--blatt); border:1px solid var(--linie);
    border-radius:2px; padding:.3rem; cursor:pointer; text-align:center;
  }
  .karte:hover{ border-color:var(--tinte); }
  .karte svg{ width:100%; height:74px; display:block; }
  .karte .bez{ font-size:.68rem; color:var(--grau); margin-top:.15rem; word-break:break-word; }

  /* ---------- Dialog ---------- */
  dialog{
    border:1px solid var(--linie2); border-radius:2px; padding:0;
    background:var(--papier); color:var(--tinte);
    max-width:min(640px,94vw); max-height:88vh; overflow:auto;
    box-shadow:0 12px 40px var(--schatten);
  }
  dialog::backdrop{ background:rgba(0,0,0,.5); }
  dialog .inhalt{ padding:1.2rem; }
  dialog h2{ font-size:1.05rem; font-weight:600; margin:0 0 .8rem; }
  .abschnitt{
    display:flex; align-items:baseline; gap:.5rem;
    font-size:.8rem; font-weight:600; color:var(--tinte); margin:1.1rem 0 .4rem;
  }
  .abschnitt .zusatz{
    margin-left:auto; font-weight:400; font-family:var(--zahl);
    font-size:.65rem; color:var(--grau);
  }
  textarea.ausgabe{
    width:100%; height:150px; font-family:var(--zahl); font-size:.72rem;
    border:1px solid var(--linie2); border-radius:2px;
    background:var(--blatt); color:var(--tinte); padding:.55rem;
  }

  @media (max-width: 760px){
    header{ padding:.6rem .8rem; gap:.55rem; }
    header h1{ font-size:.9rem; }
    header .entwurfname{ min-width:7rem; font-size:.82rem; }
    /* Auf dem Handy nur so hoch wie die Zeichnung wirklich ist - der
       gewonnene Platz geht an die Steuerleiste, wo man tatsaechlich tippt. */
    .buehne{ padding:.55rem; gap:.55rem; flex:0 0 auto; }
    .ansicht{ padding:.5rem; }
    svg.flat{ flex:none; height:auto; }
    .leiste{ flex:1; min-height:0; max-height:none; }
    .leiste .zeile{ gap:.75rem; padding:.45rem .7rem; }
    .leiste .status{ width:100%; text-align:left; margin-left:0; order:9; }
    .regler{ grid-template-columns:1fr 1fr; gap:.1rem .8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Entwurfsatelier</h1>
  <input class="entwurfname" id="entwurfName" value="Neuer Entwurf" aria-label="Name des Entwurfs">
  <div class="rechts">
    <div class="schalter" id="lichtSchalter" role="group" aria-label="Arbeitsbereich">
      <button data-licht="hell" aria-pressed="false">Hell</button>
      <button data-licht="dunkel" aria-pressed="false">Dunkel</button>
    </div>
    <span class="trenner" aria-hidden="true"></span>
    <button class="knopf" id="btnExport">Export</button>
  </div>
</header>

<main>
  <!-- Arbeitsfläche: nimmt allen Platz, der übrig ist -->
  <div class="buehne">
    <div class="ansicht" id="ansichtVorne" aria-current="true" tabindex="0">
      <span class="marke">Vorne</span>
      <svg class="flat" id="svgVorne" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="ansicht" id="ansichtHinten" tabindex="0">
      <span class="marke">Hinten</span>
      <svg class="flat" id="svgHinten" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- Regal: klappt über der Steuerleiste auf, statt ein Fenster zu öffnen -->
  <div class="regal" id="regalStreifen" hidden>
    <div id="regalInhalt"></div>
  </div>

  <!-- Steuerleiste: was du änderst, liegt direkt unter dem, was sich ändert -->
  <div class="leiste">
    <div class="zeile kopfzeile">
      <div class="schalter" id="modusSchalter" role="group" aria-label="Werkzeug">
        <button data-modus="bausteine" aria-pressed="true">Bausteine</button>
        <button data-modus="form" aria-pressed="false">Form</button>
        <button data-modus="punkte" aria-pressed="false">Punkte</button>
      </div>
      <span class="trenner" aria-hidden="true"></span>
      <div class="schalter" id="symSchalter" role="group" aria-label="Symmetrie">
        <button data-sym="1" aria-pressed="true">Symmetrisch</button>
        <button data-sym="0" aria-pressed="false">Asymmetrisch</button>
      </div>
      <div class="schalter" id="seiteSchalter" role="group" aria-label="Seite" hidden>
        <button data-seite="rechts" aria-pressed="true">Rechte Seite</button>
        <button data-seite="links" aria-pressed="false">Linke Seite</button>
      </div>
      <span class="status" id="statuszeile"></span>
      <button class="knopf" id="btnRegal" aria-expanded="false">Regal</button>
      <button class="knopf stark" id="btnSpeichern">Ablegen</button>
    </div>
    <div class="zeile reiter" id="reiterZeile"></div>
    <div class="zeile werkzeug" id="werkzeugZeile"></div>
  </div>
</main>

<dialog id="dlgExport"><div class="inhalt">
  <h2>Export</h2>
  <div id="exportInhalt"></div>
  <p style="margin-top:1rem"><button class="knopf stark" onclick="document.getElementById('dlgExport').close()">Schließen</button></p>
</div></dialog>

<script>
/* =====================================================================
   ENGINE

   Ein Kleidungsstueck ist eine geschlossene Kontur. Gespeichert wird sie
   als ZWEI Ketten, die beide oben auf der Mittellinie anfangen und unten
   auf der Mittellinie enden:

       rechts:  Mitte oben -> rechte Seite hinunter -> Mitte unten
       links:   dasselbe fuer die linke Seite (x wird beim Zeichnen negiert)

   Im symmetrischen Modus wird 'links' gar nicht benutzt - beide Seiten
   kommen aus 'rechts'. Beim Umschalten auf asymmetrisch wird 'rechts'
   einmal nach 'links' kopiert, danach sind beide unabhaengig.

   Jeder Knoten hat einen Punkt, einen Eckradius und beschreibt die Kante
   zum naechsten Knoten. Die Ecken werden tangential verrundet.
   ===================================================================== */
const E = (() => {
  const hyp = Math.hypot;
  function at(s,t){
    const u=1-t;
    return [u*u*u*s[0][0]+3*u*u*t*s[1][0]+3*u*t*t*s[2][0]+t*t*t*s[3][0],
            u*u*u*s[0][1]+3*u*u*t*s[1][1]+3*u*t*t*s[2][1]+t*t*t*s[3][1]];
  }
  function dir(s,t){
    const u=1-t;
    const dx=3*u*u*(s[1][0]-s[0][0])+6*u*t*(s[2][0]-s[1][0])+3*t*t*(s[3][0]-s[2][0]);
    const dy=3*u*u*(s[1][1]-s[0][1])+6*u*t*(s[2][1]-s[1][1])+3*t*t*(s[3][1]-s[2][1]);
    const L=hyp(dx,dy)||1; return [dx/L,dy/L];
  }
  function split(s,t){
    const lp=(a,b)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    const ab=lp(s[0],s[1]),bc=lp(s[1],s[2]),cd=lp(s[2],s[3]);
    const abc=lp(ab,bc),bcd=lp(bc,cd),m=lp(abc,bcd);
    return [[s[0],ab,abc,m],[m,bcd,cd,s[3]]];
  }
  function len(s,n){
    n=n||36; let L=0,prev=at(s,0);
    for(let i=1;i<=n;i++){ const q=at(s,i/n); L+=hyp(q[0]-prev[0],q[1]-prev[1]); prev=q; }
    return L;
  }
  function tAtLen(s,ziel,n){
    n=n||110; let L=0,prev=at(s,0);
    for(let i=1;i<=n;i++){
      const t=i/n,q=at(s,t),d=hyp(q[0]-prev[0],q[1]-prev[1]);
      if(L+d>=ziel) return (i-1)/n+(ziel-L)/(d||1)/n;
      L+=d; prev=q;
    }
    return 1;
  }
  const gerade=(a,b)=>[a,[a[0]+(b[0]-a[0])/3,a[1]+(b[1]-a[1])/3],
                         [a[0]+(b[0]-a[0])*2/3,a[1]+(b[1]-a[1])*2/3],b];
  function bogen(a,b,w,t1,t2){
    t1=t1??0.34; t2=t2??0.68;
    const cx=b[0]-a[0],cy=b[1]-a[1],L=hyp(cx,cy)||1;
    const nx=cy/L,ny=-cx/L;
    return [a,[a[0]+cx*t1+nx*w,a[1]+cy*t1+ny*w],
              [a[0]+cx*t2+nx*w*0.9,a[1]+cy*t2+ny*w*0.9],b];
  }
  function fillet(segs,radii){
    const K=0.5523,out=[];
    for(let i=0;i<segs.length;i++){
      let s=segs[i];
      const rE0=i<radii.length?(radii[i]||0):0;
      const rS0=i>0?(radii[i-1]||0):0;
      const L=len(s);
      const rE=Math.min(rE0,L*0.4), rS=Math.min(rS0,L*0.4);
      if(rE>1e-6) s=split(s,tAtLen(s,len(s)-rE))[0];
      if(rS>1e-6) s=split(s,tAtLen(s,rS))[1];
      out.push(s);
      if(i<segs.length-1&&(radii[i]||0)>1e-6){
        const nx=segs[i+1], rn=Math.min(radii[i],len(nx)*0.4);
        const nt=rn>1e-6?split(nx,tAtLen(nx,rn))[1]:nx;
        const P=s[3],Q=nt[0],tp=dir(s,1),tq=dir(nt,0);
        const h=hyp(Q[0]-P[0],Q[1]-P[1])*K;
        out.push([P,[P[0]+tp[0]*h,P[1]+tp[1]*h],[Q[0]-tq[0]*h,Q[1]-tq[1]*h],Q]);
      }
    }
    return out;
  }
  function kanteZuSeg(A,B,k){
    if(!k) return gerade(A,B);
    if(k.art==='bogen') return bogen(A,B,k.w||0,k.t1,k.t2);
    if(k.art==='kubik') return [A,k.c1,k.c2,B];
    return gerade(A,B);
  }
  // Kette -> fertige, verrundete Bezierstuecke
  function ketteSegs(kn){
    const segs=[],radii=[];
    for(let i=0;i<kn.length-1;i++) segs.push(kanteZuSeg(kn[i].p,kn[i+1].p,kn[i].kante));
    for(let i=1;i<kn.length-1;i++){
      let r=kn[i].r;
      if(r==='auto'){ r=Math.min(len(segs[i-1]),len(segs[i]))*0.44; }
      radii.push(r||0);
    }
    return fillet(segs,radii);
  }
  // Bezierstuecke an der Mittellinie spiegeln und in Gegenrichtung lesen
  function spiegeln(segs){
    return segs.slice().reverse().map(s =>
      [[-s[3][0],s[3][1]],[-s[2][0],s[2][1]],[-s[1][0],s[1][1]],[-s[0][0],s[0][1]]]);
  }
  const f2=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
  function toD(segs,zu){
    if(!segs.length) return '';
    let d='M '+f2(segs[0][0]);
    for(const s of segs) d+=' C '+f2(s[1])+' '+f2(s[2])+' '+f2(s[3]);
    return d+(zu?' Z':'');
  }
  // Geschlossene Kontur aus rechter und linker Kette
  function umrissSegs(rechts,links){
    return ketteSegs(rechts).concat(spiegeln(ketteSegs(links||rechts)));
  }
  function umrissD(rechts,links){ return toD(umrissSegs(rechts,links),true); }
  function kanteD(kn,i){ return toD([kanteZuSeg(kn[i].p,kn[i+1].p,kn[i].kante)],false); }
  return {at,dir,split,len,tAtLen,gerade,bogen,fillet,kanteZuSeg,ketteSegs,
          spiegeln,toD,umrissSegs,umrissD,kanteD};
})();

   INVENTAR

   Basis  = ein ganzes Kleidungsstueck. Legt fest, welche Steckplaetze es
            hat und welche Regler dazugehoeren.
   Teil   = ein austauschbarer Baustein fuer einen Steckplatz.
   Detail = etwas, das obendrauf liegt (Tasche, Kordel, Kapuze ...).

   Eigene Entwuerfe landen spaeter als weitere Basen in genau derselben
   Liste - zwischen "meinen" und "deinen" Teilen gibt es keinen

// Werte sind Entwurfsgroessen, keine Koerpermasse. Es geht ums Aussehen.
// Diese Werte sind aus Johans eigenen Zeichnungen gemessen, nicht geraten.
// Quelle: design-library/linearity/blatt_shirts.jpeg und blatt_pants.jpeg,
// beide A4 quer mit Lineal, umgerechnet ueber das Seitenverhaeltnis.
const FORM_STANDARD = {

function armPunkte(f, ab){
  const a=f.armwinkel*Math.PI/180;
  const tx=Math.cos(a),ty=Math.sin(a),ox=-ty,oy=tx;
  const aus=[ab[0]+f.armlaenge*tx, ab[1]+f.armlaenge*ty];
  return {aus, ein:[aus[0]+f.armweite*ox, aus[1]+f.armweite*oy]};
}

// Saum und Innenbeinnaht der Hose. 'innen' ist der Abstand der
// Innennaht von der Mitte - davon haengt ab, wie deutlich die beiden
// Beine als zwei Beine lesbar sind.
function hosenSaumBau(f, extra, rundung, gummi){
  const innen = (f.beinInnen ?? 2.4) + extra;
  const aussen = innen + f.beinweite;
  const hoehe = f.beinlaenge - f.schritt;
  return [
    {p:[aussen, f.beinlaenge], r:rundung,
     kante: gummi ? {art:'bogen', w:-0.8, bez:'Gummisaum'} : {art:'gerade', bez:'Saum'}},
    // Auf den Blaettern laeuft die Innennaht fast gerade vom Schritt zum
    // Saum - nur eine Spur nach aussen gebaucht.
    {p:[innen, f.beinlaenge], r:rundung, kante:{art:'kubik',
      c1:[innen*0.72, f.schritt + hoehe*0.60],
      c2:[innen*0.28, f.schritt + hoehe*0.22], bez:'Innenbein'}}
  ];
}

/* Auf Johans Blaettern ist der Halsausschnitt keine Kerbe im Umriss:
   oben laeuft das Halsbuendchen als flacher Bogen von Schulterpunkt zu
   Schulterpunkt durch, die eigentliche Ausschnittlinie liegt als innere
   Linie darunter. Genau so zeigt es auch studie_ausschnitte - derselbe
   Rumpf, nur der Kragen wird getauscht. Darum liefert dieser Steckplatz
   immer dieselbe Umrisskante und unterscheidet sich in 'innen'. */
function halsbandTiefe(f){ return f.halsweite*0.15; }
function halsKante(f){
  const t = halsbandTiefe(f);
  return [{p:[0,t], r:0, kante:{art:'kubik',
    c1:[f.halsweite*0.45, t], c2:[f.halsweite*0.80, 0], bez:'Halskante'}}];
}
function gespiegelt(d){ return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,
  (m,x,y) => `${(-parseFloat(x)).toFixed(2)},${y}`); }
function halsRund(f, t){
  const d = `M 0,${t.toFixed(2)} C ${(f.halsweite*0.55).toFixed(2)},${t.toFixed(2)}`
          + ` ${(f.halsweite*0.99).toFixed(2)},${(t*0.24).toFixed(2)}`
          + ` ${f.halsweite.toFixed(2)},0`;
  return [d, gespiegelt(d)];
}

    return `M ${x-b},${y+9} L ${x-b},${y-2} L ${x-b*0.45},${y-7} L ${x+b*0.45},${y-7}`
         + ` L ${x+b},${y-2} L ${x+b},${y+9}`;

  kordel:{bez:'Kordel', hinter:false, mittig:true, start:[0,11], zeichne:(x,y)=>
    `M ${x-6.5},${y} C ${x-4},${y+7} ${x-1.6},${y+9} ${x-1.6},${y+13}`
    + ` M ${x+6.5},${y} C ${x+4},${y+7} ${x+1.6},${y+9} ${x+1.6},${y+13}`},
  reiss:{bez:'Reißverschluss', basen:['oberteil'], hinter:false, mittig:true, start:[0,10], zeichne:(x,y,f)=>{
    const u=(f.laenge??70);
    return `M ${x},${y} L ${x},${u-1} M ${x-1.3},${y} L ${x-1.3},${u-1} M ${x+1.3},${y} L ${x+1.3},${u-1}`;

  knopfleiste:{bez:'Knopfleiste', basen:['oberteil'], hinter:false, mittig:true, start:[0,12], zeichne:(x,y)=>{

    for(let i=0;i<4;i++) d+=` M ${x-1},${y+i*7} L ${x+1},${y+i*7}`;
    return d;
  }},
  buendchen:{bez:'Bündchen-Linie', hinter:false, mittig:true, start:[0,64], zeichne:(x,y,f)=>{
    const b=(f.saumweite??f.weite??20)-0.6;
    return `M ${-b},${y} L ${b},${y}`;
  }},
  teilungsnaht:{bez:'Teilungsnaht', hinter:false, mittig:true, start:[0,34], zeichne:(x,y,f)=>{
    const b=(f.weite??f.bundweite??20)+0.5;

  ziernaht:{bez:'Ziernaht', hinter:false, mittig:false, start:[15,5], zeichne:(x,y)=>

  hosenschlitz:{bez:'Hosenschlitz', basen:['hose'], hinter:false, mittig:false, start:[3,1],
    zeichne:(x,y,f)=> `M ${x},${y} L ${x},${(f.schritt??30)*0.62}`
      + ` C ${x},${(f.schritt??30)*0.78} ${x+2.2},${(f.schritt??30)*0.82} ${x+3.4},${(f.schritt??30)*0.86}`},
  eingriff:{bez:'Eingrifftasche', basen:['hose'], hinter:false, mittig:false, start:[9,6],
    zeichne:(x,y)=> `M ${x-5},${y-4} C ${x-1},${y+1} ${x+2},${y+5} ${x+3},${y+9}`},
  gesaesstasche:{bez:'Gesäßtasche', basen:['hose'], hinter:false, mittig:false, start:[7,13],
    zeichne:(x,y)=> `M ${x-5},${y-5} L ${x+5},${y-5} L ${x+5},${y+2} L ${x},${y+6} L ${x-5},${y+2} Z`},
  bundfalte:{bez:'Bundfalte', basen:['hose'], hinter:false, mittig:false, start:[6,0],
    zeichne:(x,y,f)=> `M ${x},${y+1} L ${x},${(f.schritt??30)*0.75}`},
  bein_ziernaht:{bez:'Seitenstreifen', basen:['hose'], hinter:false, mittig:false, start:[13,3],
    zeichne:(x,y,f)=> `M ${x},${y} L ${x-2},${f.beinlaenge??99}`}
};

/* =====================================================================
   ZUSTAND

   form      gilt fuer beide Ansichten (Weite, Laenge, Proportionen)
   ansichten pro Ansicht: eigene Formwerte, eigene Bausteine je Seite,
             eigene Details, ggf. eingefrorene Punkte
   Bei 'symmetrie' wird 'links' staendig mit 'rechts' gleichgehalten.
   ===================================================================== */
function neueAnsicht(basisId){
  const std = kopie(BASEN[basisId].standard);
  return {
    form:{halsweite:9.7, halstiefe:8.9, laengeExtra:0},
    slots:{rechts:kopie(std), links:kopie(std)},
    details:[],
    punkte:null
  };
}
function neuerEntwurf(basisId){
  basisId = basisId || 'oberteil';
  return {
    name:'Neuer Entwurf',
    basis:basisId,
    symmetrie:true,
    form:kopie(FORM_STANDARD),
    ansichten:{ vorne:neueAnsicht(basisId), hinten:neueAnsicht(basisId) }
  };
}
let entwurf = neuerEntwurf('oberteil');
let aktiveAnsicht = 'vorne';
let modus = 'bausteine';
let aktiveSeite = 'rechts';   // nur im asymmetrischen Modus sichtbar

// Rueckseite darf anders aussehen. Auf den Blaettern ist der hintere
// Ausschnitt nur eine flache Bogenlinie, die Laenge aber dieselbe.
entwurf.ansichten.hinten.form.halstiefe = 1.5;
entwurf.ansichten.hinten.form.laengeExtra = 0;

function formFuer(ansichtId){
  const a = entwurf.ansichten[ansichtId];
  const f = Object.assign({}, entwurf.form, a.form);
  f.laenge = (f.laenge ?? 0) + (f.laengeExtra || 0);
  f.beinlaenge = (f.beinlaenge ?? 0) + (f.laengeExtra || 0);
  return f;
}
// Eine Kette (eine Seite) aus Basis + Bausteinen + Formwerten bauen
function kette(ansichtId, seite){
  const B = BASEN[entwurf.basis];
  const a = entwurf.ansichten[ansichtId];
  const wahl = a.slots[entwurf.symmetrie ? 'rechts' : seite];
  const f = formFuer(ansichtId);
  for (const s of B.slots){
    const o = TEILE[s.id].opt[wahl[s.id]];
    if (o && o.vor) o.vor(f);
  }
  let kn = [];
  for (const s of B.slots){
    const o = TEILE[s.id].opt[wahl[s.id]];
    if (o) kn = kn.concat(o.bau(f));
  }
  kn.push({p:B.endpunkt(f), r:0});
  return kn;
}
// Glatte Kurve durch eine reine Punktkette (Punkte-Modus)
function glattD(pts, eckig, offen){
  const n = pts.length;
  const tang = i => {
    if (i===0 || i===n-1){
      if (Math.abs(pts[i][0]) < 0.01){
        const nb = pts[i===0?1:n-2];
        const l = Math.hypot(nb[0]-pts[i][0], nb[1]-pts[i][1])/3;
        return [i===0?l:-l, 0];
      }
      return null;
    }
    if (eckig[i]) return null;
    return [(pts[i+1][0]-pts[i-1][0])/6, (pts[i+1][1]-pts[i-1][1])/6];
  };
  let d = offen ? '' : `M ${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for (let i=0;i<n-1;i++){
    const A=pts[i], B=pts[i+1], tA=tang(i), tB=tang(i+1);
    const c1 = tA ? [A[0]+tA[0],A[1]+tA[1]] : [A[0]+(B[0]-A[0])/3, A[1]+(B[1]-A[1])/3];
    const c2 = tB ? [B[0]-tB[0],B[1]-tB[1]] : [B[0]-(B[0]-A[0])/3, B[1]-(B[1]-A[1])/3];
    d += ` C ${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)}`
       + ` ${B[0].toFixed(2)},${B[1].toFixed(2)}`;
  }
  return d;
}
function punkteD(p, symmetrie){
  const R = p.rechts, L = symmetrie ? p.rechts : p.links;
  const eR = p.eckig.rechts, eL = symmetrie ? p.eckig.rechts : p.eckig.links;
  const rechtsD = glattD(R, eR, false);
  const gespiegelt = L.map(q => [-q[0], q[1]]).reverse();
  const eGesp = eL.slice().reverse();
  return rechtsD + glattD(gespiegelt, eGesp, true) + ' Z';
}
// Kontur der Ansicht - egal ob parametrisch oder eingefroren
function umrissVon(ansichtId){
  const a = entwurf.ansichten[ansichtId];
  if (a.punkte) return punkteD(a.punkte, entwurf.symmetrie);
  const r = kette(ansichtId,'rechts');
  if (entwurf.symmetrie) return E.umrissD(r, null);
  // Beide Seiten fangen oben auf der Mittellinie an und enden unten dort.
  // Waehlen sie unterschiedlich tiefe Ausschnitte, klaffte die Kontur an
  // diesen beiden Punkten auf. Darum gibt die rechte Seite sie vor.
  const l = kette(ansichtId,'links');
  l[0] = Object.assign({}, l[0], {p:r[0].p.slice()});
  l[l.length-1] = Object.assign({}, l[l.length-1], {p:r[r.length-1].p.slice()});
  return E.umrissD(r, l);
}

/* =====================================================================
   PUNKTE EINFRIEREN
   Wer frei an Punkten ziehen will, braucht eine Punktkette statt der
   parametrischen Bausteine. Der fertige Umriss wird dafuer abgetastet
   und mit Douglas-Peucker auf die Punkte eingedampft, die die Form
   tragen - gleichmaessige Abstaende wuerden kurze, stark gekruemmte
   Stellen wie den Halsausschnitt verschlucken.
   ===================================================================== */
function dichtAbtasten(segs, anzahl){
  const laengen = segs.map(s => E.len(s));
  const ges = laengen.reduce((a,b)=>a+b, 0) || 1;
  const pts = [];
  for (let i=0;i<=anzahl;i++){
    let rest = ges*i/anzahl, j = 0;
    while (j < segs.length-1 && rest > laengen[j]){ rest -= laengen[j]; j++; }
    pts.push(E.at(segs[j], E.tAtLen(segs[j], Math.min(rest, laengen[j]))));
  }
  return pts;
}
function abstandZurSehne(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy;
  if (L2 < 1e-9) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L2;
  t = Math.max(0, Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+dx*t), p[1]-(a[1]+dy*t));
}
function vereinfachen(pts, tol){
  if (pts.length < 3) return pts.slice();
  let maxD = 0, idx = 0;
  for (let i=1;i<pts.length-1;i++){
    const d = abstandZurSehne(pts[i], pts[0], pts[pts.length-1]);
    if (d > maxD){ maxD = d; idx = i; }
  }
  if (maxD <= tol) return [pts[0], pts[pts.length-1]];
  return vereinfachen(pts.slice(0,idx+1), tol).slice(0,-1)
    .concat(vereinfachen(pts.slice(idx), tol));
}
function abtasten(segs, ziel){
  const dicht = dichtAbtasten(segs, 360);
  let lo = 0.01, hi = 6;
  for (let i=0;i<22;i++){
    const m = (lo+hi)/2;
    if (vereinfachen(dicht, m).length > ziel) lo = m; else hi = m;
  }
  const pts = vereinfachen(dicht, hi).map(p => [rnd1(p[0]), rnd1(p[1])]);
  pts[0][0] = 0; pts[pts.length-1][0] = 0;
  return pts;
}
function eckenFinden(pts, grad){
  const grenze = (grad ?? 24)*Math.PI/180;
  return pts.map((p,i) => {
    if (i===0 || i===pts.length-1) return true;
    const a=[p[0]-pts[i-1][0], p[1]-pts[i-1][1]];
    const b=[pts[i+1][0]-p[0], pts[i+1][1]-p[1]];
    const la=Math.hypot(a[0],a[1])||1, lb=Math.hypot(b[0],b[1])||1;
    const cos=Math.min(1,Math.max(-1,(a[0]*b[0]+a[1]*b[1])/(la*lb)));
    return Math.acos(cos) > grenze;
  });
}
function einfrieren(id){
  const a = entwurf.ansichten[id];
  if (a.punkte) return;
  const r = abtasten(E.ketteSegs(kette(id,'rechts')), 20);
  const l = entwurf.symmetrie ? kopie(r) : abtasten(E.ketteSegs(kette(id,'links')), 20);
  a.punkte = {rechts:r, links:l, eckig:{rechts:eckenFinden(r), links:eckenFinden(l)}};
}
function auftauen(id){ entwurf.ansichten[id].punkte = null; }

/* =====================================================================
   ZEICHNEN
   ===================================================================== */
function detailPfade(id, hinter){
  const a = entwurf.ansichten[id], f = formFuer(id);
  const B = BASEN[entwurf.basis];
  const wahl = a.slots.rechts;
  const f2 = Object.assign({}, f);
  for (const s of B.slots){ const o = TEILE[s.id].opt[wahl[s.id]]; if (o && o.vor) o.vor(f2); }
  return a.details
    .map((d,i) => ({d, i, def:DETAILS[d.typ]}))
    .filter(x => x.def && !!x.def.hinter === !!hinter)
    .map(x => ({i:x.i, d:x.def.zeichne(x.d.p[0], x.d.p[1], f2), p:x.d.p, def:x.def}));
}
// Auf jedem Blatt laeuft vom Schulterpunkt eine nach innen gebauchte
// Kurve zur Achsel - die Armlochnaht. Sie gehoert zum Bild des
// Kleidungsstuecks und nicht zu den waehlbaren Details, darum wird sie
// hier aus der Kette heraus gezeichnet statt angeheftet.
const ARMLOCH_NAHT = {kurz:1, halb:1, lang:1, weit:1, raglan:1};
function armlochBogen(f, vz, amHals){
  const A = amHals ? [vz*f.halsweite, 0] : [vz*f.schulter, f.schulterfall];
  const B = [vz*f.weite, f.schulterfall + f.armloch];
  const dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx,dy) || 1;
  let nx = dy/L, ny = -dx/L;              // Senkrechte, die zur Mitte zeigt
  if (nx*vz > 0){ nx = -nx; ny = -ny; }
  const b = L*0.36;
  const C = [(A[0]+B[0])/2 + nx*b, (A[1]+B[1])/2 + ny*b];
  return `M ${A[0].toFixed(2)},${A[1].toFixed(2)}`
       + ` Q ${C[0].toFixed(2)},${C[1].toFixed(2)}`
       + ` ${B[0].toFixed(2)},${B[1].toFixed(2)}`;
}
// Linien, die zum Kleidungsstueck gehoeren, aber nicht zum Umriss:
// Armlochnaht und Halsausschnitt. 'aufsatz' sind Teile, die oben
// aufliegen (Stehkragen) und darum gefuellt gezeichnet werden.
function innenPfade(id){
  const a = entwurf.ansichten[id];
  const linien = [], aufsaetze = [];
  if (entwurf.basis !== 'oberteil') return {linien, aufsaetze};
  const seiten = entwurf.symmetrie ? ['rechts'] : ['rechts','links'];
  for (const seite of seiten){
    const wahl = a.slots[seite];
    const f = formFuer(id);
    for (const sl of BASEN.oberteil.slots){
      const o = TEILE[sl.id].opt[wahl[sl.id]];
      if (o && o.vor) o.vor(f);
    }
    if (ARMLOCH_NAHT[wahl.aermel]){
      const vz = seite === 'links' ? -1 : 1;
      const amHals = wahl.aermel === 'raglan';
      linien.push(armlochBogen(f, vz, amHals));
      if (entwurf.symmetrie) linien.push(armlochBogen(f, -1, amHals));
    }
    const aus = TEILE.ausschnitt.opt[wahl.ausschnitt];
    if (aus){
      // Hinten faellt die Ausschnittlinie mit der Halskante zusammen -
      // dann bleibt sie weg, sonst liegen zwei Linien uebereinander.
      if (aus.innen && f.halstiefe > halsbandTiefe(f) + 0.6){
        for (const d of aus.innen(f)){
          if (seite === 'links'){ if (d.indexOf('M -') === 0) linien.push(d); }
          else if (entwurf.symmetrie || d.indexOf('M -') !== 0) linien.push(d);
        }
      }
      if (aus.aufsatz && seite === 'rechts') aufsaetze.push(...aus.aufsatz(f));
    }
  }
  return {linien, aufsaetze};
}
function zeichneAnsicht(id){
  const svg = document.getElementById(id === 'vorne' ? 'svgVorne' : 'svgHinten');
  const a = entwurf.ansichten[id];
  svg.innerHTML = '';
  const d = umrissVon(id);

  for (const x of detailPfade(id, true)) svg.appendChild(el('path', {d:x.d, class:'detail'}));
  svg.appendChild(el('path', {d, class:'stoff'}));
  if (!a.punkte){
    const innen = innenPfade(id);
    for (const nd of innen.linien) svg.appendChild(el('path', {d:nd, class:'detail'}));
    for (const nd of innen.aufsaetze) svg.appendChild(el('path', {d:nd, class:'aufsatz'}));
  }
  for (const x of detailPfade(id, false)) svg.appendChild(el('path', {d:x.d, class:'detail'}));

  // Zuschnitt auf den Inhalt, erst nachdem alles im Dokument steht
  let bb;
  try { bb = svg.getBBox(); } catch(e){ bb = null; }
  if (!bb || !isFinite(bb.width) || bb.width < 1) bb = {x:-45, y:-8, width:90, height:90};
  const rand = Math.max(4, bb.width*0.06);
  svg.setAttribute('viewBox',
    `${bb.x-rand} ${bb.y-rand} ${bb.width+2*rand} ${bb.height+2*rand}`);
  const maszstab = (bb.width + 2*rand) / 100;

  if (!entwurf.symmetrie){
    svg.appendChild(el('line', {x1:0, y1:bb.y-rand, x2:0, y2:bb.y+bb.height+rand, class:'mittellinie'}));
  }

  if (id === aktiveAnsicht && modus === 'punkte' && a.punkte){
    const r = Math.max(0.8, maszstab*1.1);
    const seiten = entwurf.symmetrie ? ['rechts'] : ['rechts','links'];
    for (const seite of seiten){
      a.punkte[seite].forEach((p,i) => {
        const c = el('circle', {cx:(seite==='links'?-p[0]:p[0]), cy:p[1], r,
                                class:'griff' + (seite==='links'?' links':'')});
        if (!a.punkte.eckig[seite][i]) c.setAttribute('fill-opacity','0.45');
        c.addEventListener('pointerdown', ev => punktZiehen(ev, svg, id, seite, i));
        c.addEventListener('dblclick', ev => {
          ev.preventDefault();
          a.punkte.eckig[seite][i] = !a.punkte.eckig[seite][i];
          if (entwurf.symmetrie) a.punkte.eckig.links = a.punkte.eckig.rechts.slice();
          allesZeichnen();
        });
        svg.appendChild(c);
      });
    }
  }
  if (id === aktiveAnsicht && modus === 'bausteine'){
    const r = Math.max(0.8, maszstab*1.0);
    for (const x of detailPfade(id, false).concat(detailPfade(id, true))){
      const c = el('circle', {cx:x.p[0], cy:x.p[1], r, class:'griff'});
      c.addEventListener('pointerdown', ev => detailZiehen(ev, svg, id, x.i));
      c.addEventListener('dblclick', () => {
        a.details.splice(x.i,1); allesZeichnen(); panelBauen();
      });
      svg.appendChild(c);
    }
  }
}
function svgPunkt(svg, e){
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function ziehGeruest(ev, svg, beiBewegung){
  ev.preventDefault(); ev.stopPropagation();
  try { svg.setPointerCapture(ev.pointerId); } catch(e){}
  const zieh = e2 => beiBewegung(svgPunkt(svg, e2));
  const stop = () => svg.removeEventListener('pointermove', zieh);
  svg.addEventListener('pointermove', zieh);
  svg.addEventListener('pointerup', stop, {once:true});
  svg.addEventListener('pointercancel', stop, {once:true});
}
function punktZiehen(ev, svg, id, seite, i){
  const a = entwurf.ansichten[id];
  ziehGeruest(ev, svg, q => {
    const liste = a.punkte[seite];
    const fest = (i === 0 || i === liste.length-1);
    const x = fest ? 0 : Math.max(0, rnd1(seite === 'links' ? -q.x : q.x));
    liste[i] = [x, rnd1(q.y)];
    if (entwurf.symmetrie) a.punkte.links = kopie(a.punkte.rechts);
    zeichneAnsicht(id);
  });
}
function detailZiehen(ev, svg, id, i){
  const a = entwurf.ansichten[id];
  const def = DETAILS[a.details[i].typ];
  ziehGeruest(ev, svg, q => {
    a.details[i].p = [def.mittig ? 0 : rnd1(q.x), rnd1(q.y)];
    zeichneAnsicht(id);
  });
}
function allesZeichnen(){
  zeichneAnsicht('vorne');
  zeichneAnsicht('hinten');
  document.getElementById('ansichtVorne').setAttribute('aria-current', String(aktiveAnsicht==='vorne'));
  document.getElementById('ansichtHinten').setAttribute('aria-current', String(aktiveAnsicht==='hinten'));
  statusSetzen();
}
function statusSetzen(){
  const a = entwurf.ansichten[aktiveAnsicht];
  const teile = [];
  teile.push('Bearbeitet: ' + (aktiveAnsicht==='vorne'?'Vorderansicht':'Rückansicht'));
  if (!entwurf.symmetrie) teile.push('asymmetrisch — linke und rechte Seite getrennt');
  if (a.punkte) teile.push('Punkte eingefroren');
  document.getElementById('statuszeile').textContent = teile.join(' · ');
}
// Vorschaubild fuers Inventar
function miniSVG(e, ansichtId){
  const sicherung = entwurf, sicherA = aktiveAnsicht;
  entwurf = e;
  try {
    const d = umrissVon(ansichtId || 'vorne');
    const svg = el('svg', {xmlns:NS, viewBox:'-50 -12 100 110', preserveAspectRatio:'xMidYMid meet'});
    svg.appendChild(el('path', {d, fill:'var(--stoff)', stroke:'var(--tinte)',
      'stroke-width':1.4, 'stroke-linejoin':'round', 'vector-effect':'non-scaling-stroke'}));
    return svg;
  } finally { entwurf = sicherung; aktiveAnsicht = sicherA; }
}

/* =====================================================================
   INVENTAR (eigene Entwuerfe)
   Ein gespeicherter Entwurf ist im Inventar nichts anderes als eine
   Basis: du startest von ihm und veraenderst weiter.
   ===================================================================== */
const INV_KEY = 'atelier.inventar.v1';
const invLesen = () => { try { return JSON.parse(localStorage.getItem(INV_KEY))||[]; } catch(e){ return []; } };
const invSchreiben = x => { try { localStorage.setItem(INV_KEY, JSON.stringify(x)); } catch(e){} };

function insInventar(){
  const liste = invLesen();
  const name = (document.getElementById('entwurfName').value || '').trim() || ('Entwurf ' + (liste.length+1));
  entwurf.name = name;
  const vorhanden = liste.findIndex(x => x.name === name);
  const eintrag = {name, zeit:Date.now(), entwurf:kopie(entwurf)};
  if (vorhanden >= 0) liste[vorhanden] = eintrag; else liste.push(eintrag);
  invSchreiben(liste);
  panelBauen();
  if (!document.getElementById('regalStreifen').hidden) regalBauen();
  meldung(vorhanden >= 0 ? `„${name}" im Inventar aktualisiert` : `„${name}" liegt jetzt im Inventar`);
}
function ausInventar(i){
  const liste = invLesen();
  if (!liste[i]) return;
  entwurf = kopie(liste[i].entwurf);
  // aeltere Staende vertraeglich machen
  entwurf.symmetrie = entwurf.symmetrie !== false;
  for (const k of ['vorne','hinten'])
    if (!entwurf.ansichten[k]) entwurf.ansichten[k] = neueAnsicht(entwurf.basis);
  document.getElementById('entwurfName').value = entwurf.name || liste[i].name;
  reiter = null;
  symSchalterSetzen();
  panelBauen(); allesZeichnen();
  meldung(`„${liste[i].name}" geladen`);
}
function meldung(text){
  const z = document.getElementById('statuszeile');
  z.textContent = text;
  clearTimeout(meldung.t);
  meldung.t = setTimeout(statusSetzen, 2600);
}

/* =====================================================================
   BEDIENFELD
   ===================================================================== */
function abschnitt(text, zusatz){
  const h = document.createElement('div'); h.className = 'abschnitt';
  h.appendChild(document.createTextNode(text));
  if (zusatz){ const s = document.createElement('span'); s.className='zusatz'; s.textContent=zusatz; h.appendChild(s); }
  return h;
}
function chipReihe(optionen, aktiv, beiWahl, klasse){
  const box = document.createElement('div'); box.className = 'chips';
  optionen.forEach(o => {
    const b = document.createElement('button');
    b.className = 'chip' + (klasse ? ' '+klasse : '');
    b.textContent = o.bez;
    b.setAttribute('aria-pressed', String(o.id === aktiv));
    b.addEventListener('click', () => beiWahl(o.id));
    box.appendChild(b);
  });
  return box;
}
function reglerFeld(bez, wert, min, max, schritt, geteilt, beiAenderung){
  const f = document.createElement('div');
  f.className = 'feld' + (geteilt ? ' geteilt' : '');
  const l = document.createElement('label');
  const w = document.createElement('span'); w.className='wert'; w.textContent = wert;
  l.appendChild(document.createTextNode(bez)); l.appendChild(w);
  const i = document.createElement('input');
  Object.assign(i, {type:'range', min, max, step:schritt, value:wert});
  i.addEventListener('input', () => { w.textContent = i.value; beiAenderung(parseFloat(i.value)); });
  f.append(l, i);
  return f;
}
function hinweis(text, art){
  const p = document.createElement('p');
  p.className = 'hinweis' + (art ? ' '+art : '');
  p.style.margin = '.4rem 0';
  p.textContent = text;
  return p;
}

/* Welcher Reiter in der Steuerleiste gerade offen ist. 'basis' und
   'details' sind eigene Reiter, dazwischen die Steckplaetze der Basis. */
let reiter = null;
function reiterListe(){
  return ['basis'].concat(BASEN[entwurf.basis].slots.map(s => s.id)).concat(['details']);
}
function reiterName(id){
  if (id === 'basis') return 'Basis';
  if (id === 'details') return 'Details';
  return TEILE[id] ? TEILE[id].bez : id;
}
function reiterPruefen(){
  const liste = reiterListe();
  if (!liste.includes(reiter)) reiter = liste[1] || liste[0];
}

function panelBauen(){
  const rZeile = document.getElementById('reiterZeile');
  const wZeile = document.getElementById('werkzeugZeile');
  rZeile.innerHTML = ''; wZeile.innerHTML = '';
  const a = entwurf.ansichten[aktiveAnsicht];
  const B = BASEN[entwurf.basis];

  // Seitenwahl nur zeigen, wenn sie etwas bewirkt
  const sSch = document.getElementById('seiteSchalter');
  sSch.hidden = entwurf.symmetrie || modus !== 'bausteine';
  sSch.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.seite === aktiveSeite)));

  if (modus === 'bausteine'){
    reiterPruefen();
    for (const id of reiterListe()){
      const b = document.createElement('button');
      b.textContent = reiterName(id);
      b.setAttribute('aria-pressed', String(id === reiter));
      b.addEventListener('click', () => { reiter = id; panelBauen(); });
      rZeile.appendChild(b);
    }
    const slot = B.slots.find(s => s.id === reiter);
    if (slot){
      const m = document.createElement('span');
      m.className = 'marke';
      m.textContent = slot.geteilt ? 'gilt für beide Ansichten'
                                   : 'gilt nur ' + (aktiveAnsicht === 'vorne' ? 'vorne' : 'hinten');
      rZeile.appendChild(m);
    }
    if (a.punkte){
      wZeile.appendChild(hinweis('Diese Ansicht ist auf Punkte eingefroren — Bausteine und Form wirken '
        + 'darauf nicht. Unter „Punkte" kannst du sie wieder auflösen.', 'warn'));
      return;
    }
    if (reiter === 'basis')        werkzeugBasis(wZeile);
    else if (reiter === 'details') werkzeugDetails(wZeile, a);
    else                           werkzeugSlot(wZeile, a, slot);
  }

  if (modus === 'form'){
    if (a.punkte){
      wZeile.appendChild(hinweis('Diese Ansicht ist auf Punkte eingefroren — die Regler wirken erst '
        + 'wieder, wenn du die Punkte unter „Punkte" auflöst.', 'warn'));
      return;
    }
    const gitter = document.createElement('div');
    gitter.className = 'regler';
    for (const r of B.regler){
      const quelle = r.geteilt ? entwurf.form : a.form;
      const wert = quelle[r.k] ?? FORM_STANDARD[r.k] ?? 0;
      gitter.appendChild(reglerFeld(r.bez, wert, r.min, r.max, r.s, r.geteilt, val => {
        if (r.geteilt) entwurf.form[r.k] = val; else a.form[r.k] = val;
        allesZeichnen();
      }));
    }
    wZeile.appendChild(gitter);
  }

  if (modus === 'punkte'){
    const spalte = document.createElement('div');
    spalte.className = 'spalte';
    if (!a.punkte){
      spalte.appendChild(hinweis('Zum freien Ziehen wird die aktuelle Form in eine Punktkette '
        + 'umgewandelt. Danach wirken Bausteine und Regler auf diese Ansicht nicht mehr — '
        + 'bis du die Punkte wieder auflöst.'));
      const b = document.createElement('button');
      b.className = 'knopf stark'; b.textContent = 'Punkte erzeugen';
      b.addEventListener('click', () => { einfrieren(aktiveAnsicht); panelBauen(); allesZeichnen(); });
      spalte.appendChild(b);
    } else {
      spalte.appendChild(hinweis('Punkt ziehen ändert die Form. Doppelklick schaltet zwischen Ecke '
        + '(gefüllt) und weichem Übergang (blass) um.'
        + (entwurf.symmetrie ? '' : ' Gefüllte Griffe sind die rechte Seite, hohle die linke.')));
      spalte.appendChild(hinweis('Punkte rechts: ' + a.punkte.rechts.length
        + (entwurf.symmetrie ? '' : ' · links: ' + a.punkte.links.length)));
      const b = document.createElement('button');
      b.className = 'knopf'; b.textContent = 'Punkte auflösen, zurück zu den Bausteinen';
      b.addEventListener('click', () => {
        auftauen(aktiveAnsicht); panelBauen(); allesZeichnen();
        meldung('Punkte verworfen — die Bausteine wirken wieder');
      });
      spalte.appendChild(b);
    }
    wZeile.appendChild(spalte);
  }
}

function werkzeugBasis(wZeile){
  wZeile.appendChild(chipReihe(
    Object.keys(BASEN).map(id => ({id, bez:BASEN[id].bez})),
    entwurf.basis,
    id => {
      if (id === entwurf.basis) return;
      const name = document.getElementById('entwurfName').value;
      const alte = {vorne:entwurf.ansichten.vorne.details, hinten:entwurf.ansichten.hinten.details};
      entwurf = neuerEntwurf(id);
      for (const v of ['vorne','hinten'])
        entwurf.ansichten[v].details = alte[v].filter(d => {
          const def = DETAILS[d.typ];
          return def && (!def.basen || def.basen.includes(id));
        });
      entwurf.ansichten.hinten.form.halstiefe = 2.4;
      entwurf.ansichten.hinten.form.laengeExtra = 1.5;
      document.getElementById('entwurfName').value = name;
      reiter = null;
      symSchalterSetzen(); panelBauen(); allesZeichnen(); regalBauen();
    }));
}

// Ein Baustein darf gemessene Werte mitbringen ('setzt'). Die werden beim
// Anklicken einmal in den Entwurf geschrieben - danach bleiben die Regler
// frei, statt bei jedem Zeichnen ueberschrieben zu werden.
function werteUebernehmen(option){
  if (!option || !option.setzt) return;
  const regler = BASEN[entwurf.basis].regler;
  for (const [k, wert] of Object.entries(option.setzt)){
    const r = regler.find(x => x.k === k);
    if (r && r.geteilt === false){
      for (const z of ['vorne','hinten']) entwurf.ansichten[z].form[k] = wert;
    } else {
      entwurf.form[k] = wert;
    }
  }
  // Werte, die nur hinten gelten - sonst bekaeme die Rueckansicht den
  // tiefen vorderen Ausschnitt mit.
  for (const [k, wert] of Object.entries(option.setztHinten || {}))
    entwurf.ansichten.hinten.form[k] = wert;
}

function werkzeugSlot(wZeile, a, slot){
  if (!slot) return;
  const def = TEILE[slot.id];
  const seite = entwurf.symmetrie ? 'rechts' : aktiveSeite;
  wZeile.appendChild(chipReihe(
    Object.keys(def.opt).map(id => ({id, bez:def.opt[id].bez})),
    a.slots[seite][slot.id],
    id => {
      const ziele = slot.geteilt ? ['vorne','hinten'] : [aktiveAnsicht];
      for (const z of ziele){
        const av = entwurf.ansichten[z];
        av.slots[seite][slot.id] = id;
        if (entwurf.symmetrie) av.slots.links[slot.id] = av.slots.rechts[slot.id];
      }
      werteUebernehmen(def.opt[id]);
      panelBauen(); allesZeichnen();
    }));
}

function werkzeugDetails(wZeile, a){
  const spalte = document.createElement('div');
  spalte.className = 'spalte';
  const box = document.createElement('div'); box.className = 'chips';
  for (const t in DETAILS){
    const def = DETAILS[t];
    if (def.basen && !def.basen.includes(entwurf.basis)) continue;
    const b = document.createElement('button');
    b.className = 'chip zufuegen'; b.textContent = def.bez;
    b.addEventListener('click', () => {
      a.details.push({typ:t, p:def.start.slice()});
      panelBauen(); allesZeichnen();
    });
    box.appendChild(b);
  }
  spalte.appendChild(box);
  if (a.details.length){
    const drauf = document.createElement('div'); drauf.className = 'chips';
    a.details.forEach((d,i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.setAttribute('aria-pressed','true');
      b.textContent = DETAILS[d.typ].bez + ' ×';
      b.title = 'Entfernen';
      b.addEventListener('click', () => { a.details.splice(i,1); panelBauen(); allesZeichnen(); });
      drauf.appendChild(b);
    });
    spalte.appendChild(drauf);
    spalte.appendChild(hinweis('Liegt auf der ' + (aktiveAnsicht==='vorne'?'Vorderansicht':'Rückansicht')
      + '. Den Griff in der Zeichnung ziehen verschiebt ein Detail, Klick oben entfernt es.'));
  } else {
    spalte.appendChild(hinweis('Details liegen immer nur auf der gerade bearbeiteten Ansicht.'));
  }
  wZeile.appendChild(spalte);
}

/* =====================================================================
   EXPORT
   ===================================================================== */
let downloadsCap = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then(c => { downloadsCap = c; });
async function ausgeben(blob, name){
  if (downloadsCap){
    try { await downloadsCap.save({filename:name, data:blob}); return 'gespeichert'; }
    catch(e){ if (e && e.code === 'declined') return 'abgebrochen'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
  return 'gespeichert';
}
function exportSVG(){
  const teile = [];
  let versatz = 0;
  for (const id of ['vorne','hinten']){
    const quelle = document.getElementById(id==='vorne'?'svgVorne':'svgHinten');
    const vb = (quelle.getAttribute('viewBox')||'0 0 100 100').split(/\s+/).map(Number);
    const inhalt = Array.from(quelle.querySelectorAll('path'))
      .map(p => `<path d="${p.getAttribute('d')}" fill="none" stroke="#111111" stroke-width="0.6"
                  stroke-linejoin="round"/>`).join('\n      ');
    teile.push(`  <g transform="translate(${versatz - vb[0]},${-vb[1]})">
      <text x="${vb[0]+4}" y="${vb[1]+8}" font-family="sans-serif" font-size="5" fill="#666">${id==='vorne'?'Vorne':'Hinten'}</text>
      ${inhalt}
    </g>`);
    versatz += vb[2] + 10;
  }
  const hoehe = Math.max(...['vorne','hinten'].map(id => {
    const vb = (document.getElementById(id==='vorne'?'svgVorne':'svgHinten')
      .getAttribute('viewBox')||'0 0 100 100').split(/\s+/).map(Number);
    return vb[3];
  }));
  return `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${versatz} ${hoehe}" width="${versatz}mm" height="${hoehe}mm">\n`
    + teile.join('\n') + '\n</svg>\n';
}
function exportZeigen(){
  const box = document.getElementById('exportInhalt');
  box.innerHTML = '';
  box.appendChild(hinweis('Das SVG enthält Vorder- und Rückansicht nebeneinander und lässt sich in '
    + 'Inkscape öffnen. Schick es mir, wenn wir daraus in Seamly2D ein Schnittmuster bauen — '
    + 'dann muss ich dir den Entwurf nicht erst erklären lassen.', 'tipp'));
  const reihe = document.createElement('div');
  reihe.style.cssText = 'display:flex; gap:1.1rem; flex-wrap:wrap; margin:.8rem 0;';
  const meld = document.createElement('p'); meld.className = 'hinweis';
  const name = (entwurf.name || 'entwurf').replace(/[^\w\-]+/g,'_').toLowerCase();

  const bSVG = document.createElement('button');
  bSVG.className = 'knopf stark'; bSVG.textContent = 'SVG';
  bSVG.addEventListener('click', async () => {
    meld.textContent = await ausgeben(new Blob([exportSVG()], {type:'image/svg+xml'}), name+'.svg');
  });
  const bPNG = document.createElement('button');
  bPNG.className = 'knopf'; bPNG.textContent = 'PNG';
  bPNG.addEventListener('click', () => {
    const text = exportSVG();
    const vb = text.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
    const url = URL.createObjectURL(new Blob([text], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    img.onload = async () => {
      const c = document.createElement('canvas');
      c.width = 1600; c.height = Math.round(1600 * parseFloat(vb[2]) / parseFloat(vb[1]));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(async b => { meld.textContent = await ausgeben(b, name+'.png'); });
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { meld.textContent = 'PNG konnte nicht erzeugt werden.'; };
    img.src = url;
  });
  reihe.append(bSVG, bPNG);
  box.append(reihe, meld);
  const t = document.createElement('textarea');
  t.className = 'ausgabe'; t.readOnly = true; t.value = exportSVG();
  box.appendChild(abschnitt('Das steckt drin'));
  box.appendChild(t);
  document.getElementById('dlgExport').showModal();
}

function inventarSichern(){
  const liste = invLesen();
  const inhalt = JSON.stringify({art:'entwurfsatelier-inventar', fassung:1,
                                 gesichert:new Date().toISOString(), entwuerfe:liste}, null, 1);
  const datum = new Date().toISOString().slice(0,10);
  return ausgeben(new Blob([inhalt], {type:'application/json'}), `inventar-${datum}.json`);
}
async function inventarEinlesen(datei, ersetzen){
  const text = await datei.text();
  const daten = JSON.parse(text);
  const herein = Array.isArray(daten) ? daten : daten.entwuerfe;
  if (!Array.isArray(herein)) throw new Error('Das ist keine Inventar-Datei.');
  const geprueft = herein.filter(e => e && typeof e.name === 'string' && e.entwurf && e.entwurf.ansichten);
  if (!geprueft.length) throw new Error('Keine brauchbaren Entwürfe darin.');
  let liste = ersetzen ? [] : invLesen();
  let neu = 0, ersetzt = 0;
  for (const e of geprueft){
    const i = liste.findIndex(x => x.name === e.name);
    if (i >= 0){ liste[i] = e; ersetzt++; } else { liste.push(e); neu++; }
  }
  invSchreiben(liste);
  return {neu, ersetzt, gesamt:liste.length};
}

function regalBauen(){
  const box = document.getElementById('regalInhalt');
  const liste = invLesen();
  box.innerHTML = '';

  const reihe = document.createElement('div');
  reihe.className = 'reihe';
  liste.forEach((e,i) => {
    const k = document.createElement('button'); k.className = 'karte';
    k.appendChild(miniSVG(e.entwurf, 'vorne'));
    const bz = document.createElement('div'); bz.className = 'bez'; bz.textContent = e.name;
    k.appendChild(bz);
    k.title = 'Als Ausgangspunkt laden — Doppelklick löscht';
    k.addEventListener('click', () => ausInventar(i));
    k.addEventListener('dblclick', () => {
      const l = invLesen(); l.splice(i,1); invSchreiben(l); regalBauen(); panelBauen();
    });
    reihe.appendChild(k);
  });
  if (!liste.length){
    reihe.appendChild(hinweis('Noch nichts abgelegt. Bau etwas und drück unten „Ablegen" — '
      + 'der Entwurf steht danach hier und ist dein neuer Ausgangspunkt.'));
  }
  box.appendChild(reihe);

  const leiste = document.createElement('div');
  leiste.style.cssText = 'display:flex; gap:1.1rem; flex-wrap:wrap; align-items:center; margin-top:.55rem;';
  const meld = document.createElement('p'); meld.className = 'hinweis'; meld.style.marginTop = '.35rem';

  const bSich = document.createElement('button');
  bSich.className = 'knopf'; bSich.textContent = 'Als Datei sichern';
  bSich.disabled = !liste.length;
  bSich.addEventListener('click', async () => {
    try { meld.textContent = await inventarSichern(); meld.style.fontWeight = ''; }
    catch(e){ meld.textContent = 'Sichern fehlgeschlagen: ' + e.message; meld.style.fontWeight = '600'; }
  });

  const feld = document.createElement('input');
  feld.type = 'file'; feld.accept = '.json,application/json'; feld.style.display = 'none';
  feld.addEventListener('change', async () => {
    const datei = feld.files && feld.files[0];
    if (!datei) return;
    try {
      const vorher = invLesen().length;
      const ersetzen = vorher > 0 && !confirm(
        'Zum bestehenden Regal dazulegen?\n\n' +
        'OK = dazulegen (gleiche Namen werden überschrieben)\n' +
        'Abbrechen = bestehendes Regal ersetzen');
      const r = await inventarEinlesen(datei, ersetzen);
      regalBauen(); panelBauen();
      meldung(`${r.neu} neu, ${r.ersetzt} überschrieben — jetzt ${r.gesamt} im Regal.`);
    } catch(e){
      meld.textContent = 'Konnte die Datei nicht lesen: ' + e.message;
      meld.style.fontWeight = '600';
    } finally { feld.value = ''; }
  });
  const bLies = document.createElement('button');
  bLies.className = 'knopf'; bLies.textContent = 'Datei einlesen';
  bLies.addEventListener('click', () => feld.click());

  const notiz = document.createElement('span');
  notiz.className = 'hinweis';
  notiz.textContent = 'Das Regal liegt im Browser und hängt an der Adresse dieser Seite.';
  leiste.append(bSich, bLies, feld, notiz);
  box.append(leiste, meld);
}
function regalUmschalten(zeigen){
  const streifen = document.getElementById('regalStreifen');
  const knopf = document.getElementById('btnRegal');
  const offen = (zeigen === undefined) ? streifen.hidden : zeigen;
  streifen.hidden = !offen;
  knopf.setAttribute('aria-expanded', String(offen));
  knopf.textContent = offen ? 'Regal schließen' : 'Regal';
  if (offen) regalBauen();
}

   ===================================================================== */
/* Arbeitsbereich hell oder dunkel. Ohne eigene Wahl folgt die Seite dem
   System; sobald einmal umgeschaltet wurde, bleibt die Wahl gespeichert. */
const LICHT_KEY = 'atelier.licht.v1';
function lichtLesen(){
  try { return localStorage.getItem(LICHT_KEY); } catch(e){ return null; }
}
function lichtSetzen(wahl, merken){
  const wurzel = document.documentElement;
  if (wahl === 'hell' || wahl === 'dunkel'){
    wurzel.setAttribute('data-theme', wahl === 'hell' ? 'light' : 'dark');
  } else {
    wurzel.removeAttribute('data-theme');
  }
  if (merken){
    try { if (wahl) localStorage.setItem(LICHT_KEY, wahl); else localStorage.removeItem(LICHT_KEY); } catch(e){}
  }
  const dunkelJetzt = wahl ? (wahl === 'dunkel')
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.querySelectorAll('#lichtSchalter button').forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.licht === 'dunkel') === dunkelJetzt)));
  if (typeof allesZeichnen === 'function') allesZeichnen();
}
document.querySelectorAll('#lichtSchalter button').forEach(b => {
  b.addEventListener('click', () => {
    const jetzt = lichtLesen();
    // Nochmal auf dieselbe Seite tippen gibt die Kontrolle ans System zurueck
    lichtSetzen(jetzt === b.dataset.licht ? null : b.dataset.licht, true);
  });
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!lichtLesen()) lichtSetzen(null, false);
});

function symSchalterSetzen(){
  document.querySelectorAll('#symSchalter button').forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.sym === '1') === !!entwurf.symmetrie)));
}
document.querySelectorAll('#symSchalter button').forEach(b => {
  b.addEventListener('click', () => {
    const neu = b.dataset.sym === '1';
    if (neu === entwurf.symmetrie) return;
    if (!neu){
      // Beim Aufbrechen wird die rechte Seite einmal nach links kopiert,
      // danach laufen beide Seiten getrennt weiter.
      for (const id of ['vorne','hinten']){
        const a = entwurf.ansichten[id];
        a.slots.links = kopie(a.slots.rechts);
        if (a.punkte){ a.punkte.links = kopie(a.punkte.rechts); a.punkte.eckig.links = a.punkte.eckig.rechts.slice(); }
      }
      entwurf.symmetrie = false;
      meldung('Asymmetrisch — linke und rechte Seite lassen sich jetzt getrennt ändern');
    } else {
      entwurf.symmetrie = true;
      meldung('Symmetrisch — die linke Seite folgt wieder der rechten');
    }
    aktiveSeite = 'rechts';
    symSchalterSetzen(); panelBauen(); allesZeichnen();
  });
});
document.querySelectorAll('#modusSchalter button').forEach(b => {
  b.addEventListener('click', () => {
    modus = b.dataset.modus;
    document.querySelectorAll('#modusSchalter button').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.modus === modus)));
    panelBauen(); allesZeichnen();
  });
});
for (const [el2, id] of [['ansichtVorne','vorne'], ['ansichtHinten','hinten']]){
  const n = document.getElementById(el2);
  const waehlen = () => { aktiveAnsicht = id; panelBauen(); allesZeichnen(); };
  n.addEventListener('click', waehlen);
  n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); waehlen(); } });
}
document.getElementById('btnSpeichern').addEventListener('click', insInventar);
document.getElementById('btnRegal').addEventListener('click', () => regalUmschalten());
document.querySelectorAll('#seiteSchalter button').forEach(b => {
  b.addEventListener('click', () => { aktiveSeite = b.dataset.seite; panelBauen(); });
});
document.getElementById('btnExport').addEventListener('click', exportZeigen);
document.getElementById('entwurfName').addEventListener('input', e => { entwurf.name = e.target.value; });

lichtSetzen(lichtLesen(), false);
symSchalterSetzen();
panelBauen();
allesZeichnen();
</script>
</body>
</html>
